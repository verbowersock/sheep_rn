appId: com.sheeprn
---
# Test adding new Marking

- launchApp
- assertVisible: "MyFlock"

# Open the add form
- tapOn:
    id: "add-sheep-button"

# Fill required fields first
- tapOn:
    id: "tag-id-input"
- inputText: "MARKTEST001"

- tapOn:
    id: "sex-dropdown"
- tapOn:
    text: "Wether"

# Test Date of Birth
- tapOn:
    text: "Date of Birth"
- inputText: "03/01/2023"

# Test Breed dropdown - select existing breed
- tapOn:
    id: "breed-dropdown"
- tapOn:
    text: ".*"
    index: 0

# Test Marking dropdown - add new marking
- tapOn:
    id: "marking-dropdown"

# Search for a new marking that doesn't exist
- tapOn:
    text: "Search.*"
- inputText: "TestMarking789"

# Should show "Add new" button since marking doesn't exist
- assertVisible:
    text: "Add new|not found"
    optional: true

# Click Add new button
- tapOn:
    id: "add-new-marking-button"
    optional: true

# Verify we can now select the new marking
- tapOn:
    text: "TestMarking789"
    optional: true

# Close the dropdown
- pressKey: Back

# Scroll down to submit button
- scroll

# Submit the form
- tapOn:
    id: "submit-button"

# Verify success
- assertVisible: "MyFlock"
