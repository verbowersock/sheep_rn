appId: com.sheeprn
---
# Test form cancellation and error states

- launchApp
- assertVisible: "MyFlock"

# Open the add form
- tapOn:
    id: "add-sheep-button"

# Fill some fields
- tapOn:
    id: "name-input"
- inputText: "Cancel Test"

- tapOn:
    id: "tag-id-input"
- inputText: "CANCEL001"

# Scroll down to buttons
- scroll

# Test Cancel button
- tapOn:
    id: "cancel-button"

# Verify we're back to main screen
- assertVisible: "MyFlock"

# Open form again
- tapOn:
    id: "add-sheep-button"

# Verify form is cleared (no previous data)
- assertVisible:
    text: "Add New Sheep"

# Test submit button disabled state (when form is invalid)
- scroll
- tapOn:
    id: "submit-button"

# Should not submit since required fields are missing
- assertVisible:
    text: "Add New Sheep"

# Test required field error messages
- tapOn:
    id: "tag-id-input"
- inputText: "REQ001"

# Try to submit without sex and breed
- scroll
- tapOn:
    id: "submit-button"

# Should show validation errors
- assertVisible:
    text: "required|Sex|Breed"
    optional: true

# Scroll down to cancel button
- scroll

# Cancel out
- tapOn:
    id: "cancel-button"
- assertVisible: "MyFlock"
